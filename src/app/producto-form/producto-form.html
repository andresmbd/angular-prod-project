<h2>Crear producto</h2>

<form (ngSubmit)="crearProducto()">
  <label>Nombre:</label>
  <input type="text" 
  [(ngModel)]="nombre"  
  name="nombre"> <!-- [(ngModel)] conecta el input con la variable 
                        name= dentifica el control dentro del formulario-->

  <label>Descripción:</label>
  <input type="text" [(ngModel)]="descripcion" name="descripcion">

  <label>Precio:</label>
  <input type="number" [(ngModel)]="precio" name="precio">

  <label>Stock:</label>
  <input type="number" [(ngModel)]="stock" name="stock">

  <button type="submit" >Crear Producto</button>
</form>
